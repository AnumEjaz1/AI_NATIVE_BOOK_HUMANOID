openapi: 3.0.0
info:
  title: RAG Agent API
  description: API for interacting with the RAG agent system
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000
    description: Local development server
paths:
  /query:
    post:
      summary: Process a user query with the RAG agent
      description: Sends a user query to the RAG agent and returns a response grounded in book content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Successful response from the RAG agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          description: Invalid request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error during processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      summary: Health check endpoint
      description: Verifies that the service is running and healthy
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  schemas:
    QueryRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: The user's query text
          example: "What is embodied AI?"
        user_id:
          type: string
          description: Identifier for the user (optional)
          example: "user-123"
        metadata:
          type: object
          description: Additional metadata for the query (optional)
          example: {}
    QueryResponse:
      type: object
      required:
        - response
      properties:
        response:
          type: string
          description: The RAG agent's response to the query
          example: "Embodied AI refers to artificial intelligence systems that interact with the physical world through sensors and actuators..."
        sources:
          type: array
          description: List of source documents referenced in the response
          items:
            type: string
          example: ["chapter_1_introduction.md", "section_3_2_robotics.md"]
        metadata:
          type: object
          description: Additional metadata about the response
          example: {"processing_time": 1.23}
    HealthStatus:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          description: Health status of the service
          example: "healthy"
        timestamp:
          type: string
          description: ISO 8601 timestamp of the health check
          example: "2025-01-01T12:00:00Z"
    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: Error message describing what went wrong
          example: "Invalid query format"