<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <!-- Background (transparent) -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Neural network nodes -->
  <circle cx="40" cy="30" r="6" fill="#4f8bf9" opacity="0.8"/>
  <circle cx="70" cy="20" r="5" fill="#4f8bf9" opacity="0.6"/>
  <circle cx="70" cy="40" r="5" fill="#4f8bf9" opacity="0.6"/>
  <circle cx="100" cy="15" r="4" fill="#4f8bf9" opacity="0.4"/>
  <circle cx="100" cy="30" r="4" fill="#4f8bf9" opacity="0.4"/>
  <circle cx="100" cy="45" r="4" fill="#4f8bf9" opacity="0.4"/>

  <!-- Neural network connections -->
  <line x1="40" y1="30" x2="70" y2="20" stroke="#4f8bf9" stroke-width="1.5" opacity="0.5"/>
  <line x1="40" y1="30" x2="70" y2="40" stroke="#4f8bf9" stroke-width="1.5" opacity="0.5"/>
  <line x1="70" y1="20" x2="100" y2="15" stroke="#4f8bf9" stroke-width="1.5" opacity="0.3"/>
  <line x1="70" y1="20" x2="100" y2="30" stroke="#4f8bf9" stroke-width="1.5" opacity="0.3"/>
  <line x1="70" y1="40" x2="100" y2="30" stroke="#4f8bf9" stroke-width="1.5" opacity="0.3"/>
  <line x1="70" y1="40" x2="100" y2="45" stroke="#4f8bf9" stroke-width="1.5" opacity="0.3"/>

  <!-- Robot head silhouette -->
  <rect x="130" y="18" width="30" height="24" rx="6" fill="none" stroke="#4f8bf9" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="140" cy="28" r="2.5" fill="#4f8bf9"/>
  <circle cx="150" cy="28" r="2.5" fill="#4f8bf9"/>
  <!-- Antenna -->
  <line x1="145" y1="18" x2="145" y2="12" stroke="#4f8bf9" stroke-width="1.5"/>
  <circle cx="145" cy="10" r="2" fill="#4f8bf9"/>

  <!-- Circuit board pattern -->
  <path d="M170 30 Q175 25 180 30 T190 30" stroke="#4f8bf9" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M175 35 Q180 30 185 35 T195 35" stroke="#4f8bf9" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Text -->
  <text x="200" y="35" font-family="Arial, sans-serif" font-size="14" fill="#4f8bf9" font-weight="bold">AI</text>
</svg>